<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Drishya app icon: the header's eye-lens mark (src/components/site/Logo.tsx)
       scaled 24× onto a forest field. Full-bleed square; Meta and app stores
       round the corners themselves. -->
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a4d37"/>
      <stop offset="0.6" stop-color="#1f3d2b"/>
      <stop offset="1" stop-color="#162c1f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b68d4c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b68d4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="42%" cy="40%" r="65%">
      <stop offset="0" stop-color="#d2ae72"/>
      <stop offset="1" stop-color="#b68d4c"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#field)"/>
  <circle cx="512" cy="512" r="300" fill="url(#halo)"/>

  <!-- Eye-lens -->
  <path d="M 212 512 Q 512 238 812 512 Q 512 786 212 512 Z"
        fill="#d1cfc7" fill-opacity="0.10"
        stroke="#d1cfc7" stroke-opacity="0.9" stroke-width="32" stroke-linejoin="round"/>

  <!-- Iris, ringed so brass reads on forest -->
  <circle cx="512" cy="512" r="98" fill="url(#iris)"
          stroke="#f6f5f2" stroke-opacity="0.45" stroke-width="19"/>

  <!-- Glint -->
  <circle cx="474" cy="474" r="26" fill="#f6f5f2"/>

  <!-- Lash ticks, the compass-rose nod -->
  <path d="M 512 181 V 224 M 512 800 V 843"
        stroke="#d2ae72" stroke-width="29" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
